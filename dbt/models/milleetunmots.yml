version: 2

sources:

  - name: mots_app
    database: MOTS_DL
    tables:
      - name: admin_users
      - name: aircall_calls
      - name: aircall_messages
      - name: books
      - name: child_supports
      - name: children_support_modules
      - name: children
      - name: children_sources
      - name: events
      - name: groups
      - name: parents
      - name: sources
      - name: support_modules
      - name: taggings
      - name: tags
      - name: versions
      - name: workshops
      - name: scheduled_calls
      - name: tasks

  - name: fact_anonymised
    database: MOTS_DW
    schema: FACT
    tables:
      - name: super_table_anonymised2
      # Produite par admin/anonymize_aircall_ner.py (passe GLiNER), pas par dbt :
      # clee sur le hash du texte, consommee par aircall_transcriptions_anonymised.
      - name: aircall_transcriptions_ner
      # Produite par admin/segment_appels_llm.py, pas par dbt : la grille a six
      # criteres appliquee aux transcriptions anonymisees, une ligne par appel
      # et par passe. Contient aussi les 300 notes posees a la main, reprises du
      # seed segmentation_appel (origine_note = 'manuel'). Consommee par
      # aircall_analysis, qui ne garde que la note la plus recente de chaque appel.
      - name: aircall_segmentation

  - name: seed
    database: MOTS_DW
    tables:
      - name: analyse_transcript
      - name: analyse_supervision
      - name: benchmark_mecene
      - name: suivi_activite
      - name: seed_super_table
      - name: seed_mecene
      - name: factivation
      - name: segmentation_appel
      # Table de correspondance variante -> langue, consommee par
      # family_languages. Chargee par `dbt seed` depuis un CSV qui reste hors du
      # depot (.gitignore interdit tout *.csv) : elle est donc declaree en
      # source, et non appelee par ref(), sinon le parsing casse partout ou le
      # fichier est absent. Pour la corriger : editer le CSV local, puis
      # `dbt seed --select language_mapping`.
      - name: language_mapping
        description: >
          Correspondance variante observee -> langue canonique, pour
          family_languages. 492 variantes, 139 libelles. Conventions retenues,
          a discuter librement : les variantes regionales de l'arabe sont
          repliees sur "Arabe" ; un pays cite a la place d'une langue n'est pas
          devine et sort avec is_language a faux ; une variante qui nomme
          plusieurs langues sans separateur ("francais arabe") porte les
          libelles separes par une virgule.
        columns:
          - name: language_variant
            description: >
              Token nettoye, en minuscules, tel que produit par family_languages.
            tests:
              - unique
              - not_null
          - name: language_label
            description: >
              Langue canonique, ou "(reponse non exploitable)" quand la reponse
              ne nomme pas de langue. Peut porter plusieurs libelles separes par
              une virgule.
          - name: is_language
            description: >
              Faux quand la variante ne nomme pas une langue : non-reponse
              ("papa", "non", "?") ou pays cite a la place de la langue.
