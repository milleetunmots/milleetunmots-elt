version: 2

sources:

  - name: mots_app
    database: MOTS_DL
    tables:
      - name: admin_users
      - name: aircall_calls
      - name: aircall_messages
      - name: books
      - name: child_supports
      - name: children_support_modules
      - name: children
      - name: children_sources
      - name: events
      - name: groups
      - name: parents
      - name: sources
      - name: support_modules
      - name: taggings
      - name: tags
      - name: versions
      - name: workshops
      - name: scheduled_calls
      - name: tasks

  - name: fact_anonymised
    database: MOTS_DW
    schema: FACT
    tables:
      - name: super_table_anonymised2
      # Produite par admin/anonymize_aircall_ner.py (passe GLiNER), pas par dbt :
      # clee sur le hash du texte, consommee par aircall_transcriptions_anonymised.
      - name: aircall_transcriptions_ner
      # Produite par admin/segment_appels_llm.py, pas par dbt : la grille a six
      # criteres appliquee aux transcriptions anonymisees, une ligne par appel
      # et par passe. Contient aussi les 300 notes posees a la main, reprises du
      # seed segmentation_appel (origine_note = 'manuel'). Consommee par
      # aircall_analysis, qui ne garde que la note la plus recente de chaque appel.
      - name: aircall_segmentation

  - name: seed
    database: MOTS_DW
    tables:
      - name: analyse_transcript
      - name: analyse_supervision
      - name: benchmark_mecene
      - name: suivi_activite
      - name: seed_super_table
      - name: seed_mecene
      - name: factivation
      - name: segmentation_appel