version: 2

models:
  - name: family_enrollment
    description: >
      Une ligne par famille : ce que le formulaire d'inscription déclare sur ses
      motivations et son multilinguisme. Les deux questions sont facultatives.
      Les raisons d'inscription ne sont collectées que depuis le 2026-03-27
      (var enrollment_form_start_date) : filtrer sur is_after_enrollment_form_launch
      avant de calculer un taux de remplissage.
    columns:
      - name: family_id
        description: Identifiant de la famille (child_supports.id).
        tests:
          - unique
          - not_null
      - name: is_after_enrollment_form_launch
        description: >
          La famille s'est-elle inscrite après la mise en ligne des questions ?
          Dénominateur de tout taux de remplissage des raisons d'inscription.
      - name: age_bucket_at_registration
        description: >
          Tranche d'âge du cadet à l'inscription, dans la classification
          historique du projet (macro compute_age_in_month) : A/ <3 mois,
          B/ 3-12, C/ 12-18, D/ 18-24, E/ 24-30, F/ >30. Pour une lecture en
          trois paliers, regrouper A+B / C+D / E+F.
      - name: enrollment_reasons
        description: >
          Tableau brut des options cochées, tel que saisi. Les libellés varient
          selon l'âge de l'enfant ("mon bébé" / "mon enfant") : pour compter,
          passer par family_enrollment_reasons, qui les normalise.
      - name: has_enrollment_reasons
        description: La famille a-t-elle coché au moins une raison ?
      - name: is_multilingual
        description: >
          true / false / null. Dérivé de is_bilingual_current, qui existe depuis
          2022 et n'est donc pas une nouvelle donnée. Renseigné soit au formulaire, soit
          plus tard par l'accompagnante au call 0 : les deux modes de saisie sont
          mélangés. null tant que personne n'a répondu.
      - name: is_multilingual_known
        description: >
          La question a-t-elle reçu une réponse ? Dénominateur de la part de
          familles multilingues.
      - name: second_language
        description: >
          Langue déclarée, texte libre renseigné depuis 2019 : 10 512 familles
          pour 3 091 orthographes distinctes, avec plusieurs langues dans un même
          champ. Brut, non exploitable tel quel — passer par family_languages.

  - name: family_enrollment_reasons
    description: >
      Table de liaison : une ligne par couple (famille, raison cochée). Forme
      attendue par la BI pour une question à choix multiples. Les familles
      cochent 2,6 raisons en moyenne, donc les pourcentages par raison ne
      somment pas à 100 %. Compter en count(distinct family_id).
    columns:
      - name: family_id
        description: Identifiant de la famille.
        tests:
          - not_null
      - name: is_after_enrollment_form_launch
        description: >
          À filtrer avec la même valeur que le dénominateur pris dans
          family_enrollment : une poignée de familles inscrites avant le
          2026-03-27 ont des raisons renseignées et décaleraient le calcul.
      - name: reason_raw
        description: Libellé exact coché dans le formulaire, avant normalisation.
      - name: reason_label
        description: >
          Libellé normalisé, insensible à la reformulation du formulaire selon
          l'âge de l'enfant. C'est la colonne sur laquelle grouper. Préfixée
          d'une lettre de tri reprenant l'ordre de fréquence au 2026-09-29.
        tests:
          - not_null
      - name: is_free_text_reason
        description: >
          La réponse vient-elle du champ libre "Autre" ? Ces lignes sont des
          verbatims uniques (38 au 2026-09-29), à exclure des comptages par option.

  - name: family_languages
    description: >
      Une ligne par couple (famille, langue parlée à la maison). Découpe et
      regroupe le texte libre child_supports.second_language, qui mélange listes,
      annotations, pays et fautes de frappe. La table de correspondance est dans
      le seed language_mapping : c'est lui qu'il faut éditer pour corriger un
      regroupement. 96 % des tokens sont reconnus au 2026-10-02 ; le reliquat
      est une longue traîne de fautes de frappe à une occurrence.
    columns:
      - name: family_id
        description: Identifiant de la famille.
        tests:
          - not_null
      - name: language_token
        description: >
          Token nettoyé issu du découpage, avant correspondance. C'est la valeur
          à reprendre pour enrichir le seed quand is_unmapped est vrai.
      - name: language_label
        description: >
          Langue canonique. null quand le token n'est pas dans le seed.
      - name: is_language
        description: >
          Faux quand la réponse ne nomme pas une langue : non-réponse
          ("papa", "non", "?") ou pays cité à la place de la langue
          ("sénégalais", "mali"). Filtrer dessus pour tout comptage de langues.
      - name: is_unmapped
        description: >
          Le token n'a pas de correspondance dans le seed. Ces lignes sont
          conservées plutôt que perdues, pour rendre visible ce qui reste à mapper.
      - name: is_french
        description: >
          Pratique pour isoler les familles qui déclarent une autre langue que
          le français — le champ contient souvent "français" en plus.

seeds:
  - name: language_mapping
    description: >
      Correspondance variante observée -> langue canonique, pour family_languages.
      492 variantes, 139 libellés. Conventions retenues, à discuter librement :
      les variantes régionales de l'arabe sont repliées sur "Arabe" ; un pays
      cité à la place d'une langue n'est pas deviné et sort avec is_language à
      faux ; une variante qui nomme plusieurs langues sans séparateur
      ("français arabe") porte les libellés séparés par une virgule.
    columns:
      - name: language_variant
        description: Token nettoyé, en minuscules, tel que produit par family_languages.
        tests:
          - unique
          - not_null
      - name: language_label
        description: >
          Libellé canonique, ou plusieurs séparés par une virgule. Pour les
          réponses qui ne nomment pas une langue, un libellé entre parenthèses.
      - name: is_language
        description: Faux pour les non-réponses et les pays cités.
