version: 2

models:
  - name: engagements_par_projet
    description: >
      Vue d'exploitation du suivi des engagements : une ligne par financeur et
      par année, colonnes ordonnées de la synthèse vers le détail et nommées
      pour être lues sans documentation. Les six premières suffisent en séance,
      le reste répond au « pourquoi ».
      Simple renommage et réordonnancement de fact.suivi_engagements, où vivent
      les règles de calcul : c'est là qu'il faut aller pour comprendre un
      chiffre, et là qu'il faut corriger. Aucune année n'est filtrée.
    columns:
      - name: annee
        description: Année de suivi. Filtrer dessus, toutes les années sont là.
      - name: quota_vendu
        description: >
          Enfants contractualisés avec le financeur, saisis dans la feuille du
          bureau. null pour les lignes sans engagement (ARS, BAO) : les
          pourcentages d'atteinte sont alors null et non 0.
      - name: places_consommees
        description: >
          Mesure comptable à date. Une place vaut le cycle de quatre appels,
          174 jours : un enfant entré en novembre pèse 0,15.
      - name: ecart_points
        description: >
          pct_quota - pct_temps, en points. Négatif = en retard sur le
          calendrier. La colonne à trier pour savoir qui relancer.
      - name: enfants_touches
        description: >
          Mesure de portée : enfants accompagnés au moins un jour dans l'année.
          À ne jamais présenter pour places_consommees, et à ne jamais sommer
          entre années — un enfant compte sur deux années consécutives.
      - name: enfants_en_cohorte
        description: >
          Les enfants dont une cohorte tourne dans l'année, chacun pour un :
          reports de l'année précédente plus entrées de l'année. Exclut les
          inscrits sans cohorte en cours. Avec familles_en_cohorte,
          pct_en_cohorte, et la projection enfants_en_cohorte_projetes.
      - name: enfants_en_cohorte_projetes
        description: >
          La projection la plus solide : seules les entrées encore attendues sont
          estimées, les reports et les entrées déjà faites sont acquis.
      - name: enfants_entres_dans_annee
        description: >
          Les entrées de l'année, comptées une unité chacune : une famille qui
          entre dans le programme est accompagnée, qu'elle aille au bout de son
          cycle ou non. Avec familles_entrees_dans_annee et pct_entrees. La seule
          des trois mesures qui se somme entre années sans double comptage.
      - name: familles_entrees_dans_annee
        description: >
          Le même compte en familles. count(distinct) par projet : à ne pas
          sommer entre financeurs sans accepter 2 familles comptées deux fois en
          2026.
      - name: enfants_suivis_plutot_en_n_plus_1
        description: >
          Enfants comptés cette année dont la majorité du cycle tombera l'année
          suivante. Un projet dont la portée est faite de ceux-là a un retard
          structurel, pas récupérable sur l'année.
      - name: places_reportees_sur_n_plus_1
        description: Le matelas de l'année prochaine, déjà acquis.
      - name: methode_projection
        description: >
          Comment entrees_attendues a été estimé : saisonnalite_projet,
          saisonnalite_globale, aucune_entree (rien à extrapoler), annee_close.

  - name: engagements_par_categorie
    description: >
      Ventilation d'une année d'engagement entre les millésimes : une ligne par
      projet, année et catégorie, avec la règle de classement en clair et les
      bornes de dates qui la justifient. Sert à vérifier un classement sans
      ouvrir le modèle.
      Les catégories A à D somment à la portée de l'année, E est hors total
      (filtrer sur compte_dans_la_portee). Pas de pourcentage : une part
      calculée en fenêtre dans une vue change de sens selon le filtre de
      l'appelant.
    columns:
      - name: regle
        description: La condition à laquelle les enfants de la ligne sont tombés dans la catégorie.
      - name: compte_dans_la_portee
        description: Faux pour la seule catégorie E, hors total.
      - name: quota_moyen_par_enfant
        description: >
          Part de place moyenne. 0,51 pour un report de l'année précédente,
          0,64 pour une entrée de l'année : c'est ce qui explique l'écart entre
          la portée et le quota.

  - name: engagements_par_millesime
    description: >
      Croisement des deux questions que l'on confond : d'où vient l'enfant
      compté sur l'année (vient_de) et où tombe la majorité de son cycle
      (ou_tombe_le_cycle). Une ligne par projet, année, provenance et millésime
      d'atterrissage.
      Les colonnes places_en_n_moins_1 / n / n_plus_1 sont relatives à la
      colonne annee de la ligne, pas à une année civile fixe.
    columns:
      - name: vient_de
        description: >
          annee_precedente (cycle en cours au 1er janvier), annee_courante
          (cycle commencé dans l'année), annee_suivante (cohorte planifiée sur
          l'année suivante), non_planifie.
      - name: ou_tombe_le_cycle
        description: >
          Où se trouve la majorité des places de cet enfant : en N-1, en N, en
          N+1, ou cycle pas commencé. Préfixé d'un chiffre pour l'ordre de
          lecture.
      - name: nb_enfants
        description: >
          Somme contrôlée par test_engagements_par_millesime_coherence : par
          projet et par année, elle doit retomber exactement sur
          nb_enfants_suivis du suivi par projet.

  - name: kpi_fidelity
    description: >
      Vue d'exploitation du suivi Fidelity : une ligne par année et par
      indicateur, colonnes ordonnées de la synthèse vers le détail et nommées
      pour être lues sans documentation. Pivoter indicateur en lignes et annee
      en colonnes redonne exactement la grille déposée chez Fidelity, valeurs
      mesurées à la place des cibles.
      Simple renommage et réordonnancement de fact.suivi_fidelity, où vivent les
      règles de calcul : c'est là qu'il faut aller pour comprendre un chiffre, et
      là qu'il faut corriger. Aucune année n'est filtrée.
    columns:
      - name: annee
        description: Année de démarrage de la cohorte. Filtrer dessus, toutes les années sont là.
      - name: indicateur
        description: >
          Libellé français de l'indicateur. Pour filtrer de façon stable,
          préférer indicateur_code, qui ne bougera pas.
      - name: valeur
        description: >
          La mesure de l'année, en pourcentage. À ne jamais lire sans statut :
          une valeur sous la cible sur une année en cours n'est pas un retard
          constaté.
          Le KPI global compte la part des enfants à qui une petite mission a
          été posée — la mission est l'habitude nouvelle, et le KPI s'arrête à sa
          pose. Il ne lit que les cohortes au cycle achevé, sans quoi il
          s'effondre : 50,0 % en 2026 toutes cohortes confondues contre 60,9 %
          sur les seules achevées. Le détail est dans fact.suivi_fidelity.
      - name: cible
        description: >
          Cible contractuelle. Vide avant 2024 : ces années précèdent le contrat
          et ne servent que de comparaison.
      - name: ecart_points
        description: >
          valeur - cible, en points. Négatif = sous la cible. La colonne à trier
          pour savoir quel indicateur décroche.
      - name: statut
        description: >
          Le verdict en un mot : « Cible atteinte », « En retard », « En retard,
          annee en cours » quand le cycle des cohortes n'est pas clos, « Hors
          contrat » avant 2024.
      - name: annee_en_cours
        description: >
          Vrai tant que les cohortes de l'année n'ont pas fini leur cycle. La
          valeur remontera encore : ne pas la présenter comme acquise.
      - name: pct_enfants_cycle_termine
        description: >
          Part des enfants de l'année dont les quatre appels sont passés. Dit
          de combien l'année est encore susceptible de bouger.
      - name: enfants_mesures
        description: >
          Le dénominateur. À regarder avant la valeur : un taux calculé sur 585
          enfants ne se compare pas à un taux calculé sur 5 000.
      - name: pct_cohorte_mesuree
        description: >
          Part de la cohorte sur laquelle l'indicateur est réellement mesuré.
          10 % pour le KPI 1 en 2024 — le champ « tentative » n'existe dans
          l'application que depuis octobre 2024, la baseline ne porte que sur le
          quatrième trimestre.
      - name: definition
        description: >
          Numérateur et dénominateur en une phrase. À afficher à côté du chiffre
          en séance : la grille Fidelity ne porte pas les définitions.
      - name: libelle_contractuel
        description: Libellé anglais exact de la grille, à reprendre dans le reporting envoyé.

  - name: kpi_fidelity_cohorte
    description: >
      La dynamique du suivi Fidelity : une ligne par cohorte, les trois
      indicateurs du contrat en colonnes, plus l'entonnoir du dispositif de
      prise de RDV. C'est la vue à mettre sous la grille annuelle — l'année ne
      donne que trois points et lisse tout ce qui bouge.
      Le dispositif se lit en deux leviers et non un : la proposition est une
      pratique d'accompagnante, la transformation est la décision de la famille.
      Ne jamais comparer le KPI 2 des familles « avec RDV » à celui des familles
      « sans RDV » : l'écart brut n'est pas l'effet du dispositif, et le groupe
      sans RDV devient un résidu négativement sélectionné à mesure que
      l'adoption monte. L'effet réel est d'environ +7 points (skill
      analyse-cohorte, section 9).
    columns:
      - name: cohorte
        description: Cohorte d'accompagnement, au format `YYYY/MM/DD - Libellé`.
      - name: date_debut_appels
        description: Début de la fenêtre d'appel 0. C'est l'axe du temps des graphiques.
      - name: enfants
        description: Familles de la cohorte, toutes mesurables ou non.
      - name: kpi_global_nouvelle_habitude
        description: >
          Part des enfants à qui une petite mission a été posée au moins une
          fois, sur l'effectif entier de la cohorte.
          Vide tant que le cycle n'est pas clos, et c'est délibéré : une mission
          peut être posée à n'importe lequel des quatre appels, une cohorte qui
          vient de passer son appel 0 afficherait une valeur pas encore née.
          Suivre enfants_avec_une_pm pour le remplissage en cours.
      - name: kpi1_jointe_1ere_tentative
        description: >
          Part des enfants joints qui l'ont été dès la première tentative.
          L'indicateur qui porte la trace du dispositif RDV : 41 % sur les
          cohortes de janvier 2026, 56-58 % depuis l'été.
      - name: kpi2_appel0_complet
        description: >
          Part des enfants joignables dont l'appel 0 a été mené en entier.
          Plat entre 64 et 70 % sur toute l'année 2026, montée du dispositif
          comprise.
      - name: pct_rdv_propose
        description: >
          Part des enfants dont la famille a reçu le lien Calendly. Pratique
          d'accompagnante, en tout ou rien : le levier actionnable.
      - name: pct_transformation
        description: >
          Part des enfants sollicités dont la famille a posé un créneau. La décision de
          la famille. 30-40 % au printemps 2026, 43-52 % depuis l'été.
      - name: pct_rdv_pris
        description: Le résultat des deux leviers. 0 % en janvier 2026, 42-45 % à l'automne.
      - name: rdv_sans_proposition
        description: >
          RDV posés sans proposition détectée — l'utm du SMS en rate quelques-uns.
          Explique l'écart entre pct_rdv_pris et le produit des deux autres taux.
      - name: enfants_joints_1ere_tentative
        description: Numérateur du KPI 1. Voir enfants_call0_ok pour la raison d'être de ces colonnes.
      - name: enfants_call0_ok
        description: >
          Numérateur du KPI 2. Les numérateurs et dénominateurs bruts sont
          exposés pour qu'on puisse **repooler** à une autre maille que la
          cohorte : un taux ne s'additionne jamais, il faut sommer les
          numérateurs et les dénominateurs puis diviser. Deux cohortes de mars
          2025 démarrent le même jour, et un graphique ayant la date en
          dimension affichait 154 % — la somme de deux taux.
      - name: enfants_rdv_propose
        description: Numérateur du taux de proposition, et dénominateur de la transformation.
      - name: enfants_rdv_propose_et_pris
        description: Numérateur de la transformation.
      - name: enfants_rdv_pris
        description: Numérateur du taux de RDV pris.
      - name: appels_0_termines
        description: >
          Faux tant que la fenêtre d'appel 0 n'est pas close. Filtrer dessus
          avant de tracer KPI 1 ou KPI 2.
      - name: cycle_termine
        description: Vrai quand les quatre appels sont passés. Conditionne le KPI global.
