version: 2

models:
  - name: sources_a_relancer
    description: >
      Sources d'inscription à recontacter : inactives au regard de leur propre
      rythme, en baisse sur un an, ou jamais démarrées. Une ligne par source.
      PMI et partenaires locaux seulement, les CAF sont hors périmètre.
      Simple sélection de fact.activite_sources, où vivent les règles et le
      backtest qui les justifie.
    columns:
      - name: source_id
        tests:
          - unique
          - not_null
      - name: statut
        description: >
          inactive : silence ≥ 3 × l'intervalle habituel (30 jours minimum),
          signal backtesté (précision 0,65 à 120 jours). en_baisse : moins de
          40 % des inscriptions des mêmes 180 jours un an plus tôt, ou des
          mêmes 90 jours, règle non
          backtestée. jamais_demarree : créée depuis 60 jours ou plus, sans
          aucune inscription.
        tests:
          - accepted_values:
              values: ['inactive', 'en_baisse', 'jamais_demarree']
      - name: date_bascule_inactive
        description: >
          Jour où la source a franchi son seuil de silence. Renseigné pour les
          seules inactives : c'est sur lui que l'alerte filtre pour ne signaler
          chaque source qu'une fois.
      - name: email_contact_principal
        description: >
          Le professionnel qui a inscrit le plus récemment via la source. Saisi
          seulement depuis août 2026, sur un tiers des inscriptions : souvent
          vide pour les sources silencieuses de longue date.
      - name: emails_contacts
        description: Tous les professionnels de la source, du plus récent au plus ancien.
      - name: date_premiere_inscription
        description: >
          Première inscription connue. Pour les sources antérieures à 2024, elle
          tombe en février 2024, date de la reprise de l'historique dans
          l'application, et non au vrai démarrage du partenariat.
      - name: plus_long_silence_passe_jours
        description: >
          Le plus long écart entre deux jours d'inscription, silence en cours
          exclu. Un silence actuel plus long (is_silence_record) sort de toutes
          les habitudes de la source.
      - name: nb_inscriptions_meme_periode_n1
        description: >
          Inscriptions un an plus tôt, sur la période calendaire du silence en
          cours. Non nul : la source inscrivait à cette époque l'an dernier, le
          silence n'est donc pas saisonnier.
      - name: mois_les_plus_actifs
        description: Les trois mois de l'année où la source inscrit le plus, tout historique confondu.

  - name: inscriptions_sources_mois
    description: >
      Inscriptions mensuelles de chaque source, de son premier mois au mois en
      cours, mois vides à 0. Sert la courbe « Inscriptions de la source par
      mois » du dashboard Sources à relancer, qui la borne à l'année en cours, ou aux 6 derniers mois si c'est plus long.
      Même définition d'une inscription que fact.activite_sources
      (fact.inscriptions_sources).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['source_id', 'mois']
    columns:
      - name: statut
        description: Statut d'alerte du jour de la source, pour filtrer la courbe comme les listes.
      - name: statut_libelle
        description: Le statut en clair (« N'inscrit plus », « Inscrit moins qu'avant »…), celui du filtre Statut.
      - name: nb_inscriptions_n1
        description: >
          Le même mois un an plus tôt ; null avant le premier mois de la source.
      - name: is_mois_en_cours
        description: Le mois en cours est partiel, à ne pas lire comme une baisse.
