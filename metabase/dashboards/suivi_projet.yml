# Suivi des engagements par projet : ou en est chaque financeur de ce qu'il a
# contractualise, et qui relancer.
#
# OU VIVENT LES REGLES. Pas ici. Tout vient de analytics.engagements_par_projet,
# vue d'exploitation de fact.suivi_engagements, ou vivent les calculs. Cette
# spec ne fait que choisir quoi montrer et dans quel ordre.
#
# L'ANNEE N'EST PAS CODEE EN DUR : chaque carte lit la derniere annee pour
# laquelle la feuille du bureau porte un engagement. Aujourd'hui 2026, demain
# 2027 sans toucher a la spec.
#
# LA MESURE FACE AU QUOTA EST LE NOMBRE D'ENFANTS ENTRES EN COHORTE dans
# l'annee (enfants_entres_dans_annee), et non les places consommees. Choix de
# l'utilisateur, 2026-10-20 : ce qu'on a vendu, c'est un nombre d'enfants a
# accompagner, on le compare donc a un nombre d'enfants reellement entres.
# 6 020 entres face a 6 920 vendus en 2026.
#
# ET ON MONTRE LES DEUX NOMBRES, PAS UN TAUX. Ni pourcentage d'atteinte, ni
# ecart au calendrier : le lecteur voit 6 920 et 6 020 cote a cote et tire sa
# propre conclusion. La vue porte pct_entrees et ecart_points si le besoin
# revient, mais les mettre en tuile transformerait un constat en jugement.
#
# PAS DE FILTRE ANNEE, DELIBEREMENT. Sans selection un field filter ne filtre
# rien, et les tuiles sommeraient alors toutes les annees -- or un enfant a
# cheval sur deux annees est compte dans les deux par la portee. Le perimetre
# est donc fixe en dur a la derniere annee portant un engagement. Le filtre
# Financeur, lui, ne presente pas ce risque.
#
# DEUX ONGLETS. « Par financeur » repond a « ou en est-on », « Detail des
# enfants » a « de qui parle-t-on ». Le filtre Financeur porte les deux : on
# choisit un financeur en haut, on lit son chiffre puis sa liste.
#
# LE DETAIL VIENT DE fact.suivi_engagements_enfant, PAS DE fact.mecene. mecene
# ne porte aucune colonne financeur -- il faudrait y rederiver le rattachement
# source -> projet, alors que suivi_engagements_enfant est precisement le detail
# de l'agregat affiche dans l'autre onglet, et porte project_label depuis le
# 2026-10-20. Lire le detail ailleurs que dans le modele qui produit l'agregat,
# c'est se garantir deux chiffres differents.
#
# LE DETAIL EXCLUT LES COHORTES EXCLUES (is_cohorte_exclue), et c'est ce qui le
# fait reconcilier avec les tuiles : sans ce filtre on compte 6 483 entrees en
# 2026 la ou l'agregat en affiche 6 020. Les 463 d'ecart sont des enfants de
# cohortes sorties des analyses. Un onglet qui contredit l'autre est pire que
# pas d'onglet du tout.
#
# LA VENTILATION N-1 / N : enfants_venus_de_n_moins_1 plus
# enfants_entres_dans_annee font exactement enfants_en_cohorte (3 954 + 6 020 =
# 9 974 en 2026). Les deux premiers sont en tuile, le total est dans le tableau.
#
# LES TROIS MESURES NE DISENT PAS LA MEME CHOSE et ne s'additionnent pas. C'est
# le piege central de ce suivi, repris de l'en-tete de fact.suivi_engagements :
#   enfants_entres      les entrees de l'annee, une unite chacune. C'est celle
#                       qu'on compare au quota, et la seule des trois qui se
#                       somme entre annees sans double comptage.
#   places_consommees   mesure comptable. Une place vaut le cycle de 174 jours ;
#                       un enfant entre en novembre pese 0,15. Utile pour savoir
#                       ce qui a ete reellement delivre, pas pour le quota.
#   enfants_touches     mesure de portee. Les enfants a qui 1001 mots a parle au
#                       moins un jour dans l'annee. Toujours superieure, et a ne
#                       JAMAIS presenter pour des places.
# Un enfant a cheval sur deux annees est compte dans les deux par la portee,
# partage entre elles par le quota, et compte une fois par les entrees.
#
# NE JAMAIS SOMMER LES ANNEES sur la portee ni sur les places : un meme enfant
# compte sur deux annees consecutives. L'historique en bas de page se lit annee
# par annee, jamais en cumul.

name: Suivi de projet — engagements par financeur
description: >
  Ou en est chaque financeur de ce qu'il a contractualise. Le quota vendu vient
  de la feuille du bureau, le reste de l'application. La mesure qu'on lui oppose
  est le nombre d'enfants ayant demarre une cohorte dans l'annee : on a vendu un
  nombre d'enfants a accompagner, on compte les enfants entres. Les deux nombres
  sont montres cote a cote, sans taux ni ecart.
  Attention, les trois mesures ne s'additionnent pas et ne se remplacent pas :
  les entrees comptent les arrivees de l'annee, les enfants en cohorte y
  ajoutent les reports, les places proratisent chacun selon la part de son cycle
  tombant dans l'annee. Detail dans les notes en bas de page.
  Spec : metabase/dashboards/suivi_projet.yml

collection: Claude/Suivi de projet
database: snowflake_dw

tabs:
  - Par financeur
  - Detail des enfants

filters:
  - slug: financeur
    display_name: Financeur
    type: string/=
    dimension: ANALYTICS.ENGAGEMENTS_PAR_PROJET.PROJET

cards:

  - name: Titre constat
    tab: Par financeur
    display: heading
    row: 0
    col: 0
    size_x: 24
    size_y: 1
    text: L'annee en cours — ce qui a ete vendu, ce qui est entre

  - name: Projet · Quota vendu
    tab: Par financeur
    display: scalar
    row: 1
    col: 0
    size_x: 8
    size_y: 4
    filters: [financeur]
    description: >
      Enfants contractualises avec les financeurs sur l'annee en cours, saisis
      dans la feuille du bureau. Les projets sans engagement -- bouche-a-oreille,
      reinscriptions, sources de test -- n'y figurent pas : leur quota est vide
      et non nul.
    visualization:
      scalar.field: Quota vendu
    sql: |
      select sum(quota_vendu) as "Quota vendu"
      from analytics.engagements_par_projet
      where annee = (select max(annee) from analytics.engagements_par_projet
                     where quota_vendu is not null)
        [[and {{financeur}}]]

  - name: Projet · Enfants entres en cohorte
    tab: Par financeur
    display: scalar
    row: 1
    col: 8
    size_x: 8
    size_y: 4
    filters: [financeur]
    description: >
      Enfants ayant demarre une cohorte dans l'annee, comptes une unite chacun.
      C'est la mesure qui se compare au quota vendu : on a vendu un nombre
      d'enfants a accompagner, on compte les enfants reellement entres.
      A ne pas confondre avec les enfants EN cohorte, qui ajoutent les reports de
      l'annee precedente, ni avec les places consommees, qui proratisent chaque
      enfant selon la part de son cycle tombant dans l'annee. Les trois sont
      dans le tableau ci-dessous.
    visualization:
      scalar.field: Enfants entres en cohorte
    sql: |
      select sum(enfants_entres_dans_annee) as "Enfants entres en cohorte"
      from analytics.engagements_par_projet
      where annee = (select max(annee) from analytics.engagements_par_projet
                     where quota_vendu is not null)
        [[and {{financeur}}]]

  - name: Projet · Enfants reportes de l'annee precedente
    tab: Par financeur
    display: scalar
    row: 1
    col: 16
    size_x: 8
    size_y: 4
    filters: [financeur]
    description: >
      Enfants dont l'accompagnement etait deja en cours au 1er janvier, et qui
      continuent dans l'annee. Ils ne comptent pas dans les entrees -- ils ont
      ete comptes l'annee ou ils sont entres -- mais ils mobilisent des
      accompagnantes et consomment des places.
      Avec les entrees, ils font le nombre d'enfants dont une cohorte tourne
      dans l'annee : 3 954 plus 6 020 font les 9 974 de 2026.
    visualization:
      scalar.field: Reportes de l'annee precedente
    sql: |
      select sum(enfants_venus_de_n_moins_1) as "Reportes de l'annee precedente"
      from analytics.engagements_par_projet
      where annee = (select max(annee) from analytics.engagements_par_projet
                     where quota_vendu is not null)
        [[and {{financeur}}]]

  - name: Titre financeurs
    tab: Par financeur
    display: heading
    row: 4
    col: 0
    size_x: 24
    size_y: 1
    text: Par financeur — du plus gros engagement au plus petit

  - name: Projet · Le detail par financeur
    tab: Par financeur
    display: table
    row: 5
    col: 0
    size_x: 24
    size_y: 8
    filters: [financeur]
    description: >
      Une ligne par financeur ayant un engagement sur l'annee en cours, du plus
      gros quota au plus petit. Les trois mesures sont cote a cote parce
      qu'elles ne disent pas la meme chose : les ENTREES comptent les enfants
      ayant demarre une cohorte dans l'annee, les enfants EN COHORTE y ajoutent
      les reports de l'annee precedente, et les PLACES proratisent chacun selon
      la part de son cycle tombant dans l'annee. Seule la premiere se compare au
      quota vendu.
    sql: |
      select
          projet                          as "Financeur",
          quota_vendu                     as "Quota vendu",
          enfants_entres_dans_annee       as "Enfants entres en cohorte",
          enfants_venus_de_n_moins_1      as "Reportes de l'annee precedente",
          enfants_en_cohorte              as "Enfants en cohorte, reports compris",
          round(places_consommees, 0)     as "Places consommees",
          enfants_touches                 as "Enfants touches dans l'annee"
      from analytics.engagements_par_projet
      where annee = (select max(annee) from analytics.engagements_par_projet
                     where quota_vendu is not null)
        and quota_vendu is not null
        [[and {{financeur}}]]
      order by quota_vendu desc

  - name: Projet · Ce qui remplit le quota — entrees et reports
    tab: Par financeur
    display: combo
    row: 13
    col: 0
    size_x: 24
    size_y: 7
    filters: [financeur]
    description: >
      Les douze plus gros engagements de l'annee. La barre empilee montre les
      enfants dont une cohorte tourne dans l'annee, separes en deux : ceux
      ENTRES cette annee, et ceux REPORTES de l'annee precedente. Le quota vendu
      est pose par-dessus en repere.
      Seule la part « entres cette annee » se compare au quota : un report a
      deja ete compte l'annee de son arrivee. La hauteur totale de la pile dit
      la charge reelle portee par les accompagnantes, qui est une autre
      question.
      Le quota est trace en ligne pointillee et non en barre : Metabase empile
      tout ou rien sur un graphique en barres, une troisieme barre viendrait
      s'ajouter a la pile au lieu de se poser a cote.
    visualization:
      graph.dimensions: [Financeur]
      graph.metrics: [Entres cette annee, Reportes de l'an passe, Quota vendu]
      stackable.stack_type: stacked
      graph.y_axis.title_text: enfants
      series_settings:
        Entres cette annee:
          display: bar
          color: "#88BF4D"
        Reportes de l'an passe:
          display: bar
          color: "#F2A86F"
        Quota vendu:
          display: line
          color: "#509EE3"
          line.style: dotted
          line.marker_enabled: true
    sql: |
      select
          projet                      as "Financeur",
          enfants_entres_dans_annee   as "Entres cette annee",
          enfants_venus_de_n_moins_1  as "Reportes de l'an passe",
          quota_vendu                 as "Quota vendu"
      from analytics.engagements_par_projet
      where annee = (select max(annee) from analytics.engagements_par_projet
                     where quota_vendu is not null)
        and quota_vendu is not null
        [[and {{financeur}}]]
      order by quota_vendu desc
      limit 12

  - name: Titre historique
    tab: Par financeur
    display: heading
    row: 20
    col: 0
    size_x: 24
    size_y: 1
    text: Historique — a lire annee par annee, jamais en cumul

  - name: Projet · Entrees et portee par annee
    tab: Par financeur
    display: bar
    filters: [financeur]
    row: 21
    col: 0
    size_x: 24
    size_y: 7
    description: >
      Enfants entres en cohorte et enfants touches, par annee. Les deux courbes ne mesurent pas la meme chose et l'ecart entre
      elles est normal : la portee compte tout enfant accompagne au moins un jour
      dans l'annee, les entrees ne comptent que ceux qui ont demarre une cohorte.
      Ne pas sommer les annees : un enfant a cheval sur deux annees est compte
      dans les deux par la portee.
    visualization:
      graph.dimensions: [Annee]
      graph.metrics: [Enfants entres en cohorte, Enfants touches dans l'annee]
    sql: |
      select
          annee::varchar                      as "Annee",
          sum(enfants_entres_dans_annee)      as "Enfants entres en cohorte",
          sum(enfants_touches)                as "Enfants touches dans l'annee"
      from analytics.engagements_par_projet
      where annee between 2022 and (select max(annee) from analytics.engagements_par_projet
                                    where quota_vendu is not null)
        [[and {{financeur}}]]
      group by 1
      order by 1

  - name: Notes de lecture projet
    tab: Par financeur
    display: text
    row: 28
    col: 0
    size_x: 24
    size_y: 6
    text: |
      ## Comment lire ces chiffres

      **Les trois mesures ne s'additionnent pas et ne se remplacent pas.** Les *enfants entres en cohorte* comptent ceux qui ont demarre un accompagnement dans l'annee, une unite chacun : c'est la mesure qu'on oppose au quota vendu. Les *enfants en cohorte* y ajoutent les reports de l'annee precedente. Les *places consommees* proratisent chaque enfant selon la part de son cycle tombant dans l'annee — un enfant entre en novembre n'en pese que 0,15 — et disent ce qui a ete reellement delivre. Les *enfants touches* comptent tout enfant accompagne au moins un jour : toujours les plus nombreux.

      **Ne jamais sommer les annees** sur la portee ni sur les places : un enfant a cheval sur deux annees est compte dans les deux par la portee, et partage entre elles par le quota. Seules les entrees se somment sans double comptage — c'est d'ailleurs pourquoi l'historique en bas de page les porte.

      **Un quota vendu vide n'est pas un zero.** Les projets sans engagement — bouche-a-oreille, reinscriptions directes, sources de test — n'ont pas de ligne dans la feuille du bureau. Leurs pourcentages d'atteinte sont vides et non nuls : un retard la ou il n'y a pas d'objectif n'existe pas.

      **Aucun taux d'atteinte n'est affiche, c'est voulu.** Les deux nombres sont cote a cote et chacun tire sa conclusion : un pourcentage transformerait un constat en jugement, sans dire si le retard est rattrapable. La vue `analytics.engagements_par_projet` porte `pct_entrees` et `ecart_points` si le besoin revient.

  - name: Titre detail enfants
    tab: Detail des enfants
    display: heading
    row: 0
    col: 0
    size_x: 24
    size_y: 1
    text: Choisir un financeur en haut de page pour voir ses enfants un par un

  - name: Projet · Detail des enfants du financeur
    tab: Detail des enfants
    display: table
    row: 1
    col: 0
    size_x: 24
    size_y: 14
    filters: [financeur]
    description: >
      Une ligne par enfant rattache au financeur sur l'annee en cours, du plus
      recemment entre au plus ancien. Meme perimetre que l'onglet precedent :
      les cohortes exclues des analyses n'y figurent pas, de sorte que le nombre
      de lignes « Entre dans l'annee » retombe sur la tuile.
      La colonne Rattachement reprend la classification du modele et non une
      regle ecrite ici : entre dans l'annee, reporte de l'annee precedente, ou
      inscrit sans cohorte encore demarree.
      Le filtre Financeur arrive en portee par une jointure sur la vue
      d'agregat : c'est ce qui permet qu'un seul filtre serve les deux onglets.
    sql: |
      select
          e.child_id                          as "Enfant",
          e.cohorte                           as "Cohorte",
          case e.rattachement_temporel
              when 'annee_courante'   then 'Entre dans l''annee'
              when 'annee_precedente' then 'Reporte de l''annee precedente'
              when 'annee_suivante'   then 'Inscrit, cohorte l''annee suivante'
              when 'non_planifie'     then 'Inscrit, cohorte non planifiee'
              when 'non_accompagne'   then 'Inscrit, jamais accompagne'
          end                                 as "Rattachement",
          e.date_debut_accompagnement         as "Debut d'accompagnement",
          e.group_status                      as "Statut",
          e.source_name                       as "Source d'inscription",
          e.famille_departement               as "Departement",
          e.child_age_in_month                as "Tranche d'age",
          round(e.quota_annee, 2)             as "Place consommee dans l'annee",
          e.deux_appels_ok                    as "Deux appels OK"
      from fact.suivi_engagements_enfant as e
      inner join analytics.engagements_par_projet
              on engagements_par_projet.project_code = e.project_code
             and engagements_par_projet.annee        = e.annee_suivi
      where e.annee_suivi = (select max(annee) from analytics.engagements_par_projet
                             where quota_vendu is not null)
        and not coalesce(e.is_cohorte_exclue, false)
        [[and {{financeur}}]]
      order by e.date_debut_accompagnement desc nulls last
