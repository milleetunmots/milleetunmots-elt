  - name: Mon taux de proposition de rendez-vous
    tab: Mes statistiques
    display: line
    row: 13
    col: 0
    size_x: 12
    size_y: 6
    filters: [accompagnante]
    description: >
      Part de mes familles a qui j'ai envoye le lien de prise de rendez-vous,
      par cohorte depuis le deploiement de fevrier 2026, face au collectif.
      C'est le levier que l'accompagnante controle entierement, et il vaut
      environ +7 points sur le taux d'appels OK (skill analyse-cohorte,
      section 9).
      La pratique est franchement en tout ou rien : sur les cohortes de la
      rentree, sept accompagnantes sont a 0 % et presque toutes les autres entre
      95 et 100 %. Il n'y a quasiment personne au milieu -- etre a zero se voit
      donc du premier coup d'oeil.
      Les enfants sans accompagnante affectee sont exclus des deux series : ils
      sont 596 sur la rentree, tous sans statut d'appel, et tireraient le
      collectif vers le bas sans correspondre a personne.
    visualization:
      graph.dimensions: [Debut des appels]
      graph.metrics: [Moi, Collectif]
      graph.y_axis.title_text: "%"
      graph.y_axis.auto_range: false
      graph.y_axis.min: 0
      graph.y_axis.max: 100
    sql: |
      with moi as (
          select super_table.child_id,
                 coalesce(super_table.has_booking_proposal_call0, 0) as propose,
                 groups.date_call0_start::date                       as debut,
                 groups.date_call0_end::date                         as fin
          from fact.super_table
          inner join dim.groups as groups on groups.group_name = super_table.cohort_name
          where not coalesce(super_table.is_excluded_from_analytics, false)
            and nullif(trim(super_table.supporter_name), '') is not null
            [[and {{accompagnante}}]]
      ),
      tous as (
          select st.child_id,
                 coalesce(st.has_booking_proposal_call0, 0) as propose,
                 g.date_call0_start::date                   as debut,
                 g.date_call0_end::date                     as fin
          from fact.super_table as st
          inner join dim.groups as g on g.group_name = st.cohort_name
          where not coalesce(st.is_excluded_from_analytics, false)
            and nullif(trim(st.supporter_name), '') is not null
      ),
      moi_coh as (
          select debut, round(100.0 * avg(propose), 1) as taux
          from moi where fin <= current_date and debut >= '2026-02-01' group by 1
      ),
      tous_coh as (
          select debut, round(100.0 * avg(propose), 1) as taux
          from tous where fin <= current_date and debut >= '2026-02-01' group by 1
      )
      select tous_coh.debut as "Debut des appels", moi_coh.taux as "Moi", tous_coh.taux as "Collectif"
      from tous_coh
      left join moi_coh on moi_coh.debut = tous_coh.debut
      order by 1

  - name: Mes familles a un appel KO
    tab: Mes statistiques
    display: table
    row: 13
    col: 12
    size_x: 12
    size_y: 6
    filters: [accompagnante]
    description: >
      Mes familles dont le cycle n'est pas termine et qui ont deja UN appel
      manque. Deux appels KO consecutifs valent desengagement automatique :
      chacune de ces familles est a un appel rate de sortir du programme.
      Un seul scan de super_table, le filtre pose une fois : les sessions sont
      depivotees ensuite, sinon le filtre ne s'appliquerait qu'a la premiere
      branche de l'union.
      Comptage de familles et non d'enfants, contrairement au suivi financeur :
      ce qu'on relance, c'est un foyer.
    sql: |
      with base as (
          select super_table.family_id,
                 super_table.call_0_status as s0, super_table.call1_status as s1,
                 super_table.call2_status as s2,
                 groups.date_call0_end::date as f0, groups.date_call1_end::date as f1,
                 groups.date_call2_end::date as f2, groups.date_call3_end::date as fin_cycle
          from fact.super_table
          inner join dim.child  as child  on child.child_id  = super_table.child_id
          inner join dim.groups as groups on groups.group_id = child.group_id
          where not coalesce(super_table.is_excluded_from_analytics, false)
            [[and {{accompagnante}}]]
      ),
      sessions as (
          select family_id, 0 as n, s0 as statut, f0 as fin, fin_cycle from base
          union all select family_id, 1, s1, f1, fin_cycle from base
          union all select family_id, 2, s2, f2, fin_cycle from base
      ),
      par_famille_session as (
          select family_id, n, max(statut) as statut, max(fin) as fin, max(fin_cycle) as fin_cycle
          from sessions group by 1, 2
      ),
      par_famille as (
          select family_id, max(fin_cycle) as fin_cycle,
                 count_if(statut in ('KO', 'Numéro erroné', 'Ne pas appeler') and fin <= current_date) as nb_ko,
                 max(case when statut in ('KO', 'Numéro erroné', 'Ne pas appeler') and fin <= current_date
                          then n end)                                                                  as derniere_session_ko
          from par_famille_session group by 1
      )
      select 'Appel ' || derniere_session_ko::varchar as "Appel manque",
             count(*)                                 as "Familles a relancer"
      from par_famille
      where fin_cycle > current_date and nb_ko = 1
      group by 1
      order by 1
